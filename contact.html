<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My College Diary</title>
    
    <style>
        :root {
            --bg-color: #310000;
            --accent-pink: #ffffff;
            --gothic: 'UnifrakturMaguntia', cursive;
        }

        /* 1. Custom Cursor Style */
        #cursor-follower {
            width: 30px;
            height: 30px;
            border: 2px solid var(--accent-pink);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 999;
            transition: transform 0.1s ease-out;
            transform: translate(-50%, -50%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Times New Roman", Times, serif; }

        body {
            background-color: var(--bg-color);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            /* Smooth background transition */
            transition: background 0.5s ease;
        }

        header {
            background-color: #30020292;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(55, 2, 2, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 a {
            text-decoration: none;
            color: white;
            font-family: var(--gothic);
            font-size: 32px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 20px;
            font-family: var(--gothic);
            position: relative;
            transition: 0.3s;
        }

        /* 2. Magnetic Navigation Underline */
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--accent-pink);
            transition: width 0.3s ease;
        }

        nav a:hover::after { width: 100%; }
        nav a:hover { color: var(--accent-pink); text-shadow: 0 0 8px var(--accent-pink); }

        section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        /* 3. Glassmorphism Contact Card */
        .contact-card {
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 
                        inset 0 0 20px rgba(139, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Initial reveal animation */
            animation: cardPop 0.8s ease-out forwards;
        }

        @keyframes cardPop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .contact-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent-pink);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 
                        0 0 20px rgba(255, 182, 193, 0.1);
        }

        .contact-card h2 {
            font-family: var(--gothic);
            font-size: 36px;
            margin-bottom: 25px;
            border-bottom: 2px solid white;
            display: inline-block;
            padding-bottom: 5px;
            color: white;
        }

        .contact-info strong {
            display: block;
            font-family: var(--gothic);
            font-size: 26px;
            margin-top: 20px;
            color: var(--accent-pink);
        }

        .contact-info p {
            font-size: 18px;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        
    </style>
</head>
<body>

<div id="cursor-follower"></div>

<header>
    <h1><a href="index.html">My College Diary</a></h1>
    <nav>
        <a href="index.html">Home</a> 
        <a href="about.html">About</a>
        <a href="diary.html">Diary</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section>
    <div class="contact-card">
        <h2>Contact Information</h2>
        <div class="contact-info">
            <strong>Email:</strong>
            <p>ramosayti@gmail.com</p>
            
            <strong>Phone:</strong>
            <p>+63 916 222 0238</p>
        </div>
    </div>
</section>

<script>
    const follower = document.getElementById('cursor-follower');

    // Cursor Follower Logic
    document.addEventListener('mousemove', (e) => {
        follower.style.left = e.clientX + 'px';
        follower.style.top = e.clientY + 'px';

        // Background Interaction (Subtle spotlight)
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        document.body.style.background = `radial-gradient(circle at ${x}% ${y}%, #4e0000 0%, #310000 60%)`;
    });
</script>

</body>
</html>
